<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10151d">
  <meta name="description" content="Fils & Filles — Grandir en Christ. Une application de croissance spirituelle créée par Jonathan Mwaka.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Fils & Filles — Grandir en Christ</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="brand-mini">
        <strong>FILS & FILLES</strong>
        <span>Grandir en Christ</span>
      </div>
      <button class="icon-btn" id="notifyBtn" aria-label="Notifications">🔔</button>
    </header>

    <main id="screen"></main>

    <nav class="bottom-nav">
      <button data-screen="home" class="nav-item active"><span>⌂</span><small>Accueil</small></button>
      <button data-screen="teachings" class="nav-item"><span>▣</span><small>Enseign.</small></button>
      <button data-screen="prayer" class="nav-item"><span>🙏</span><small>Prière</small></button>
      <button data-screen="program" class="nav-item"><span>▦</span><small>Programme</small></button>
      <button data-screen="profile" class="nav-item"><span>♙</span><small>Profil</small></button>
    </nav>
  </div>

  <div id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <div class="logo-mark">✝</div>
      <div><b>FILS & FILLES</b><small>Grandir en Christ</small></div>
      <button id="closeDrawer">×</button>
    </div>
    <button data-screen="home">⌂ Accueil</button>
    <button data-screen="teachings">▣ Enseignements</button>
    <button data-screen="prayer">🙏 Prière</button>
    <button data-screen="program">▦ Programme</button>
    <button data-screen="members">👥 Fils & filles</button>
    <button data-screen="challenges">🎯 Défis</button>
    <button data-screen="testimonies">💬 Témoignages</button>
    <button data-screen="library">📚 Bibliothèque</button>
    <button data-screen="profile">♙ Mon profil</button>
    <div class="creator">Créée par<br><strong>JONATHAN MWAKA</strong></div>
  </div>
  <div id="overlay" class="overlay hidden"></div>

  <script src="app.js"></script>
</body>
</html>
