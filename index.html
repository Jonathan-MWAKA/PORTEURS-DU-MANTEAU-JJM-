<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#111827">
  <meta name="background-color" content="#111827">
  <meta name="description"
        content="PORTEURS DU MANTEAU JJM — La vérité qui impacte.">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="stylesheet" href="./style.css">

  <title>PORTEURS DU MANTEAU JJM</title>
</head>

<body>

  <!-- ÉCRAN DE DÉMARRAGE -->
  <div id="splash">

    <div class="splash-logo">✝</div>

    <h1>PORTEURS DU MANTEAU</h1>

    <p>LA VÉRITÉ QUI IMPACTE</p>

    <div class="creator-splash">
      Une application créée par
      <strong>JONATHAN MWAKA</strong>
    </div>

    <div class="loader"></div>

  </div>


  <!-- APPLICATION -->
  <div id="app">

    <header class="app-header">

      <div class="brand">

        <div class="brand-icon">✝</div>

        <div>
          <strong>PORTEURS DU MANTEAU</strong>
          <small>LA VÉRITÉ QUI IMPACTE</small>
        </div>

      </div>

      <button
        id="installButton"
        class="install-button"
        style="display:none;">
        ⬇️
      </button>

    </header>


    <main id="content"></main>


    <!-- PIED DE PAGE -->
    <footer class="app-footer">

      <div class="footer-line"></div>

      <strong>JONATHAN MWAKA</strong>

      <p>Créateur de l'application</p>

      <small>
        © 2026 JONATHAN MWAKA — PORTEURS DU MANTEAU JJM
      </small>

    </footer>


    <!-- NAVIGATION -->
    <nav class="bottom-navigation">

      <button
        class="nav-button active"
        data-page="home"
        onclick="navigate('home')">

        <span>🏠</span>
        <small>Accueil</small>

      </button>


      <button
        class="nav-button"
        data-page="teachings"
        onclick="navigate('teachings')">

        <span>📖</span>
        <small>Enseignements</small>

      </button>


      <button
        class="nav-button"
        data-page="prayer"
        onclick="navigate('prayer')">

        <span>🙏</span>
        <small>Prière</small>

      </button>


      <button
        class="nav-button"
        data-page="challenges"
        onclick="navigate('challenges')">

        <span>🔥</span>
        <small>Défis</small>

      </button>


      <button
        class="nav-button"
        data-page="profile"
        onclick="navigate('profile')">

        <span>👤</span>
        <small>Profil</small>

      </button>

    </nav>

  </div>


  <div id="toast"></div>


  <script src="./app.js"></script>


  <script>

    let deferredPrompt = null;


    window.addEventListener(
      "beforeinstallprompt",
      function(event) {

        event.preventDefault();

        deferredPrompt = event;

        const button =
          document.getElementById("installButton");

        if (button) {
          button.style.display = "block";
        }

      }
    );


    document
      .getElementById("installButton")
      ?.addEventListener(
        "click",
        async function() {

          if (!deferredPrompt) {

            showToast(
              "L'installation n'est pas encore disponible."
            );

            return;
          }

          deferredPrompt.prompt();

          const result =
            await deferredPrompt.userChoice;

          if (result.outcome === "accepted") {

            showToast(
              "PORTEURS DU MANTEAU est installé !"
            );

          }

          deferredPrompt = null;

          this.style.display = "none";

        }
      );


    window.addEventListener(
      "appinstalled",
      function() {

        const button =
          document.getElementById("installButton");

        if (button) {
          button.style.display = "none";
        }

        showToast(
          "Application installée avec succès !"
        );

      }
    );


    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register("./service-worker.js", {
              scope: "./"
            })
            .then(function(registration) {

              console.log(
                "Service Worker actif :",
                registration.scope
              );

            })
            .catch(function(error) {

              console.error(
                "Service Worker :",
                error
              );

            });

        }
      );

    }


    window.addEventListener(
      "load",
      function() {

        setTimeout(
          function() {

            const splash =
              document.getElementById("splash");

            if (splash) {

              splash.classList.add("hidden");

              setTimeout(
                () => splash.remove(),
                500
              );

            }

          },
          1500
        );

      }
    );

  </script>

</body>
</html>
